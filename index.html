function drawBoard(ex){
  const g = L.game, el = app.querySelector('#board');
  const flip = new Chess(ex.fen).turn() === 'b';
  const targets = L.from ? g.moves({square:L.from, verbose:true}) : [];
  const files = 'abcdefgh', board = g.board();
  let html = '';
  for (let rr = 0; rr < 8; rr++) for (let ff = 0; ff < 8; ff++){
    const r = flip ? 7-rr : rr, f = flip ? 7-ff : ff;
    const sq = files[f] + (8-r), p = board[r][f];
    const t = targets.find(m => m.to === sq);
    const cls = ['sq', (r+f)%2 ? 'd' : '', L.from===sq ? 'sel' : '', L.moved && (L.moved.from===sq || L.moved.to===sq) ? 'last' : '', t ? 'tgt' : '', t && t.captured ? 'cap' : ''].join(' ');
    const coordF = rr === 7 ? `<span class="cf">${files[f]}</span>` : '';
    const coordR = ff === 0 ? `<span class="cr">${8-r}</span>` : '';
    html += `<button class="${cls}" data-sq="${sq}" aria-label="${sq}${p ? ' ' + (p.color==='w'?'branca':'preta') : ''}">${p ? `<span class="pc ${p.color}">${pieceSvg(p.type, p.color)}</span>` : ''}${coordF}${coordR}</button>`;
  }
  el.innerHTML = html;
  app.querySelector('#turn').textContent = new Chess(ex.fen).turn() === 'w' ? 'Você joga de brancas' : 'Você joga de pretas';
  app.querySelector('#undo').hidden = !L.moved || L.state !== 'answer';
  el.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => tapSquare(ex, b.dataset.sq));
  attachDrag(el, sq => tapSquare(ex, sq), sq => { const p = L && L.state === 'answer' && L.game.get(sq); return !!p && p.color === L.game.turn(); });
}
function tapSquare(ex, sq){
  if (L.state !== 'answer') return;
  const g = L.game;
  if (L.moved){ g.undo(); L.moved = null; }
  const p = g.get(sq);
  if (L.from){
    const m = g.moves({square:L.from, verbose:true}).find(m => m.to === sq);
    if (m){ L.moved = g.move({from:L.from, to:sq, promotion:'q'}); moveSound(L.moved, g); L.from = null; app.querySelector('#go').disabled = false; drawBoard(ex); animateMove(app.querySelector('#board'), L.moved); return; }
  }
  L.from = p && p.color === g.turn() ? sq : null;
  app.querySelector('#go').disabled = true;
  drawBoard(ex);
}
function chessSolution(ex){
  const g = new Chess(ex.fen), all = g.moves({verbose:true});
  let m;
  if (ex.goal === 'mate') m = all.find(x => { g.move(x); const ok = g.in_checkmate(); g.undo(); return ok; });
  else if (ex.goal === 'capture') m = all.find(x => x.to === ex.sq && x.captured);
  else if (ex.goal === 'move') m = all.find(x => ex.moves.includes(x.from + x.to));
  else m = all.find(x => x.from === ex.sq);
  return m ? m.san : '';
}
function chessCorrect(ex){
  const m = L.moved; if (!m) return false;
  if (ex.goal === 'mate') return L.game.in_checkmate();
  if (ex.goal === 'capture') return m.to === ex.sq && !!m.captured;
  if (ex.goal === 'move') return ex.moves.includes(m.from + m.to);
  return m.from === ex.sq;
}

const LEVELS = {
  facil:  {name:'Fácil',   depth:1, q:0, noise:160, random:.25, xp:10},
  medio:  {name:'Médio',   depth:2, q:3, noise:12,  random:0,   xp:20, ms:900},
  dificil:{name:'Difícil', depth:4, q:3, noise:0,   random:0,   xp:30, ms:1800},
};
const MATE = 100000, ABORT = {};
let nodes = 0, deadline = Infinity;
const tick = () => { if ((++nodes & 127) === 0 && Date.now() > deadline) throw ABORT; };
function evaluate(g){
  const bd = g.board(); let s = 0;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++){
    const p = bd[r][f]; if (!p) continue;
    const v = VAL[p.type] + PST[p.type][p.color === 'w' ? r*8+f : (7-r)*8+f];
    s += p.color === 'w' ? v : -v;
  }
  return g.turn() === 'w' ? s : -s;
}
function orderMoves(ms){
  const sc = m => (m.captured ? 1000 + 10*VAL[m.captured] - VAL[m.piece] : 0) + (m.promotion ? 800 : 0) + (m.san.includes('+') ? 50 : 0);
  return ms.sort((a,b) => sc(b) - sc(a));
}
function qsearch(g, alpha, beta, q){
  tick();
  const stand = evaluate(g);
  if (q === 0 || stand >= beta) return stand;
  if (stand > alpha) alpha = stand;
  for (const m of orderMoves(g.moves({verbose:true}).filter(m => m.captured))){
    g.move(m); const v = -qsearch(g, -beta, -alpha, q-1); g.undo();
    if (v >= beta) return v;
    if (v > alpha) alpha = v;
  }
  return alpha;
}
function negamax(g, depth, alpha, beta, q){
  tick();
  if (depth === 0) return qsearch(g, alpha, beta, q);
  const ms = g.moves({verbose:true});
  if (!ms.length) return g.in_check() ? -MATE - depth : 0;
  if (g.insufficient_material()) return 0;
  for (const m of orderMoves(ms)){
    g.move(m); const v = -negamax(g, depth-1, -beta, -alpha, q); g.undo();
    if (v >= beta) return v;
    if (v > alpha) alpha = v;
  }
  return alpha;
}
// Aprofundamento iterativo: busca 1, 2, 3… lances à frente até acabar o tempo do nível
function pickMove(g, lv){
  let ms = orderMoves(g.moves({verbose:true}));
  if (lv.random && Math.random() < lv.random) return ms[Math.floor(Math.random()*ms.length)];
  deadline = lv.ms ? Date.now() + lv.ms : Infinity; nodes = 0;
  let pick = ms[0];
  for (let d = 1; d <= lv.depth; d++){
    try {
      const s = new Chess(g.fen()); // cópia: se o tempo acabar no meio, a partida real não é tocada
      let best = -Infinity, cand = ms[0];
      for (const m of ms){
        s.move(m);
        let v = -negamax(s, d-1, -Infinity, -(best - (lv.noise||0)), lv.q);
        s.undo();
        if (lv.noise) v += Math.random() * lv.noise;
        if (v > best){ best = v; cand = m; }
      }
      pick = cand;
      ms = [cand, ...ms.filter(m => m !== cand)];
      if (best > MATE/2) break;
    } catch(e){ if (e !== ABORT) throw e; break; }
  }
  deadline = Infinity;
  return {from:pick.from, to:pick.to, promotion:pick.promotion, san:pick.san};
}

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

function attachDrag(el, tap, own){

    const st = dd.st; if (!st || e.pointerId !== st.id) return; dd.st = null;

// A peça desliza da casa de origem até a de destino (uma cópia flutuante por cima do tabuleiro).
const MOVE_MS = 280;
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) { return false; } };
function slidePiece(board, from, to){
  const a = board.querySelector(`[data-sq="${from}"]`), b = board.querySelector(`[data-sq="${to}"]`);
  const real = b && b.querySelector('.pc');
  if (!a || !real) return;
  const br = board.getBoundingClientRect(), ar = a.getBoundingClientRect(), bb = b.getBoundingClientRect();
  const gh = real.cloneNode(true);
  gh.classList.add('pc-fly');
  Object.assign(gh.style, {left:(ar.left - br.left) + 'px', top:(ar.top - br.top) + 'px', width:ar.width + 'px', height:ar.height + 'px', fontSize:getComputedStyle(b).fontSize});
  board.appendChild(gh);

  gh.getBoundingClientRect();
  gh.style.transform = `translate(${bb.left - ar.left}px, ${bb.top - ar.top}px)`;
  const done = () => { real.style.visibility = ''; gh.remove(); };
  gh.addEventListener('transitionend', done, {once:true});
  setTimeout(done, MOVE_MS + 120);
}

  const el = board.querySelector(`[data-sq="${sq}"]`); if (!el) return;
  const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();

  board.appendChild(gh);
  setTimeout(() => gh.remove(), 1300);
}
function animateMove(board, mv){
  if (!board || !mv || reduceMotion()) return;
  slidePiece(board, mv.from, mv.to);
  if (mv.flags && mv.flags.includes('e')) fadeCaptured(board, mv.to[0] + mv.from[1], mv.color === 'w' ? 'b' : 'w');
  if (mv.captured) setTimeout(() => { const t = board.querySelector(`[data-sq="${mv.to}"]`); if (t) t.classList.add('hit'); }, MOVE_MS - 40);
  if (mv.flags && (mv.flags.includes('k') || mv.flags.includes('q'))){
    const r = mv.color === 'w' ? '1' : '8', king = mv.flags.includes('k');
    slidePiece(board, (king ? 'h' : 'a') + r, (king ? 'f' : 'd') + r);
  }
}

function checkEnd(){
  const g = G.g;
  if (g.in_checkmate()) return endGame(g.turn() === G.me ? 'bot' : 'me', g.turn() === G.me ? 'Xeque-mate! Essa foi minha. Bora outra?' : 'Xeque-mate… Você me venceu! Parabéns!'), true;
  if (g.in_stalemate()) return endGame('draw', 'Empate por afogamento: o rei não está em xeque, mas não tem lance possível.'), true;
  if (g.in_threefold_repetition()) return endGame('draw', 'Empate: a mesma posição se repetiu três vezes.'), true;
  if (g.insufficient_material()) return endGame('draw', 'Empate: não sobrou material para dar mate.'), true;
  if (g.in_draw()) return endGame('draw', 'Empate pela regra dos 50 lances.'), true;
  return false;
}
function endGame(result, msg){
  G.over = true; G.thinking = false; G.say = msg; G.hint = null;
  G.mood = result === 'me' ? 'sad' : result === 'bot' ? 'cheer' : 'idle';
  const st = S.chessStats || (S.chessStats = {w:0, d:0, l:0});
  st[result === 'me' ? 'w' : result === 'bot' ? 'l' : 'd']++;

  if (xp){ awardXp(xp); G.say += ` +${xp} XP.`; }

  saveGame(); drawGame();
}
function gameUndo(){
  const g = G.g;
  if (G.thinking || G.over || g.turn() !== G.me || g.history().length < 2) return;
  g.undo(); g.undo();
  const h = g.history({verbose:true}); G.last = h[h.length-1] || null;
  G.from = null; G.hint = null; G.mood = 'idle'; G.say = 'Lance desfeito. Tente outro caminho.';
  saveGame(); drawGame();
}
function gameHint(){
  if (G.thinking || G.over || G.g.turn() !== G.me) return;

}

function bindFcCard(body, c){

  const g = body.querySelector('#fcgo'); if (g) g.onclick = () => startFc(c);

function startFc(c){
  const fc = S.fc || (S.fc = {}), t = today();
  const cards = fcCards(c);
  const due = shuffle(cards.filter(k => fc[fcKey(c, k)] && fc[fcKey(c, k)].due <= t)).sort((a, b) => fc[fcKey(c, a)].due < fc[fcKey(c, b)].due ? -1 : 1).slice(0, FC_SESSION);
  const fresh = cards.filter(k => !fc[fcKey(c, k)]).slice(0, Math.min(fcNewLeft(c), FC_SESSION - due.length));
  let queue = [...due, ...fresh];
  // Nada pendente: treino livre com cartões já vistos (ou novos), sem estourar o limite diário de novos
  if (!queue.length) queue = shuffle(cards.filter(k => fc[fcKey(c, k)])).slice(0, 10);
  if (!queue.length) queue = cards.slice(0, 10);
  L = null; G = null; T = null;
  F = {c, queue, total:queue.length, pos:0, flipped:false, again:new Set(), reviewed:0, right:0};
  renderFc();
}
function fcNext(st, g){
  st = Object.assign({iv:0, ef:2.5, reps:0}, st || {});
  if (g === 0) return {iv:0, ef:Math.max(1.3, st.ef - 0.2), reps:0};
  if (g === 1) return {iv:st.reps ? Math.max(1, Math.round(st.iv * 1.2)) : 1, ef:Math.max(1.3, st.ef - 0.15), reps:st.reps + 1};
  if (g === 2) return {iv:st.reps === 0 ? 1 : st.reps === 1 ? 3 : Math.max(st.iv + 1, Math.round(st.iv * st.ef)), ef:st.ef, reps:st.reps + 1};
  return {iv:st.reps === 0 ? 3 : st.reps === 1 ? 6 : Math.max(st.iv + 2, Math.round(st.iv * st.ef * 1.3)), ef:st.ef + 0.15, reps:st.reps + 1};
}
const fcLabel = iv => iv === 0 ? 'agora' : iv === 1 ? '1 dia' : iv < 30 ? iv + ' dias' : iv < 365 ? Math.round(iv / 30) + ' meses' : '1 ano+';

function fcGrade(g){
  const c = F.c, card = F.queue[F.pos], k = fcKey(c, card);
  S.fc = S.fc || {};
  const isNew = !S.fc[k];
  const nx = fcNext(S.fc[k], g);
  S.fc[k] = Object.assign(nx, {due:addDays(nx.iv)});
  if (isNew){
    if (!S.fcNew || S.fcNew.date !== today()) S.fcNew = {date:today(), n:{}};
    S.fcNew.n[c.id] = (S.fcNew.n[c.id] || 0) + 1;
  }
  F.reviewed++;
  if (g === 0){ if (!F.again.has(k)){ F.again.add(k); F.queue.push(card); F.total++; } chime(false); }
  else { F.right++; chime(true); }
  save();
  F.pos++; F.flipped = false;
  if (F.pos >= F.queue.length) return fcEnd();
  renderFc();
}
function fcEnd(){
  const c = F.c, xp = Math.min(15, 5 + Math.floor(F.reviewed / 2));

// ---------- correção ----------
function check(){
  const ex = L.queue[L.pos], c = L.c;
  const typedEl = app.querySelector('#typed');
  const given = ['pick','pickpt','quiz','blank'].includes(ex.kind) ? L.sel : ['build','listenb'].includes(ex.kind) ? L.built.map(i => ex.bank[i]).join(' ') : ex.kind === 'order' ? L.built.map(i => ex.bank[i]).join('\n') : typedEl ? typedEl.value : '';
  let res, shown = '';
  if (ex.kind === 'pick' || ex.kind === 'pickpt' || ex.kind === 'quiz'){ res = L.sel === ex.answer ? 'exact' : false; shown = ex.answer; }
  else if (ex.kind === 'blank'){ res = L.sel === ex.answer ? 'exact' : false; shown = ex.tg; }
  else if (ex.kind === 'build' || ex.kind === 'listenb'){ res = judge(L.built.map(i=>ex.bank[i]).join(' '), ex.answers, c) === 'exact' ? 'exact' : false; shown = ex.tg; }
  else if (ex.kind === 'board'){ res = chessCorrect(ex) ? 'exact' : false; shown = 'Lance correto: ' + sanPt(chessSolution(ex)); }
  else if (ex.kind === 'order'){ res = L.built.map(i=>ex.bank[i]).join('\n') === ex.lines.join('\n') ? 'exact' : false; shown = ex.lines.join('\n'); }
  else if (ex.kind === 'num'){ const v = parseNum(app.querySelector('#typed').value); res = Math.abs(v - parseNum(ex.answer)) < 1e-9 ? 'exact' : false; shown = ex.answer; app.querySelector('#typed').readOnly = true; }
  else { res = judge(app.querySelector('#typed').value, ex.answers, c); shown = ex.tg; }
  L.state = 'checked';
  if (ex.kind === 'board'){ L.from = null; drawBoard(ex); }
  const key = ex.ref && ex.ref.t ? `${ex.ref.unit}|${ex.ref.t}|${ex.ref.i}` : null;
  const ms = CS(c.id).mistakes;
  const pyLine = c.cjk && ex.py && shown === ex.tg ? `  (${ex.py})` : '';
  const shownTxt = ex.kind === 'board' || ex.kind === 'quiz' || ex.kind === 'num' || ex.kind === 'order' ? shown : show(shown, c) + pyLine;
  if (res){
    L.correct++;
    if (!L.wrongOnce.has(L.pos)) L.firstTry++;
    if (key && ms[key]){ ms[key]--; if (ms[key] <= 0) delete ms[key]; }
    const praise = ['Muito bem!','Isso aí!','Perfeito!','Mandou bem!','Excelente!'][Math.floor(Math.random()*5)];
    const title = res === 'typo' ? 'Quase! Confira a grafia:' : res === 'accent' ? 'Certo! Só atenção aos acentos:' : praise;
    const detail = ex.expl ? ex.expl : res === 'exact' ? (c.cjk && ex.py && ex.kind !== 'pick' && ex.kind !== 'pickpt' ? shownTxt : '') : shownTxt;
    feedback(true, title, detail);
    if (ex.tg) speak(ex.tg);
  } else {
    if (key) ms[key] = (ms[key]||0) + 2;
    L.queue.push(Object.assign({}, ex)); L.wrongOnce.add(L.queue.length-1);
    feedback(false, ex.kind === 'board' ? 'Não foi esse.' : ex.kind === 'order' ? 'A ordem certa é:' : ex.expl ? `Resposta correta: ${shownTxt}` : 'Resposta correta:', ex.kind === 'order' ? shownTxt + '\n\n' + ex.expl : ex.expl || shownTxt);
    app.querySelector('.stage').classList.add('shake');
    showAiTools(ex, given);
    if (ex.tg) speak(ex.kind === 'pickpt' ? ex.answer : ex.tg);
  }
  save();
}

function feedback(ok, title, detail){
  app.querySelector('#check').classList.add(ok ? 'ok' : 'bad');
  app.querySelector('#fbt').textContent = title;
  app.querySelector('#fbd').textContent = detail || '';
  const pm = app.querySelector('.stage .mascot');
  if (pm) pm.outerHTML = mascot(ok ? 'happy' : 'sad', 64);
  else app.querySelector('#fbm').innerHTML = mascot(ok ? 'happy' : 'sad', 56);
  const go = app.querySelector('#go'); go.disabled = false; go.textContent = 'Continuar'; go.focus();
  const sk = app.querySelector('#skip'); if (sk) sk.hidden = true;
  app.querySelector('.lhead .bar i').style.width = Math.round(L.correct/L.total*100) + '%';
  chime(ok);
}

function next(){
  L.pos++;
  if (L.pos >= L.queue.length) return finish();
  renderEx();
}

function awardXp(n){
  S.xp += n;
  if (S.todayDate !== today()){ S.todayDate = today(); S.todayXp = 0; }
  S.todayXp += n;
  const hs = S.hist || (S.hist = {}); hs[today()] = (hs[today()]||0) + n;
  Object.keys(hs).sort().slice(0,-21).forEach(k => delete hs[k]);
  if (S.lastDay !== today()){ S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = today(); }
  save();
}
function finish(){
  const secs = Math.round((Date.now() - L.startedAt)/1000);
  const acc = Math.round(L.firstTry / L.total * 100);
  const c = L.c, unit = L.unit, cs = CS(c.id);
  const gained = 10 + (acc === 100 ? 5 : 0);
  awardXp(gained);
  if (unit.id !== 'review') cs.units[unit.id] = (cs.units[unit.id]||0) + 1;
  save();
  app.innerHTML = `<div class="end">
    ${mascot('cheer', 150)}
    <h1>${acc===100 ? 'Lição perfeita!' : 'Lição concluída!'}</h1>
    <p style="margin:0;color:var(--muted)">${esc(c.name)} · ${esc(unit.title)} · ${liveStreak()} ${liveStreak()===1?'dia':'dias'} seguidos</p>
    <div class="cards">

      <div class="card blue"><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>Tempo</span></div>
    </div>
    <button class="btn" id="cont">Continuar</button>
  </div>`;
  chime(true);
  app.querySelector('#cont').onclick = home;
}

  const s = pzStats(); clearInterval(Z.tm); clearTimeout(Z.nt); Z.over = true; Z.state = 'over';

  const xp = Math.min(Z.score, 15); if (xp) awardXp(xp); save();
  chime(Z.score > 0);
  const tp = app.querySelector('#pztime'); if (tp) tp.textContent = '0:00';
  app.querySelector('.stage').innerHTML = `<div class="pzend"><div class="burst">${Z.score}</div>
    <h2>${why}</h2><p>${Z.score === 1 ? '1 acerto' : Z.score + ' acertos'}${rec ? ' · novo recorde!' : ` · recorde: ${s.rush}`}${xp ? ` · +${xp} XP` : ''}</p>
    <div class="row gbtns"><button class="btn" id="pzagain">Jogar de novo</button><button class="btn ghost" id="pzback">Voltar</button></div></div>`;
  app.querySelector('#pzagain').onclick = () => pzStart('rush');
  app.querySelector('#pzback').onclick = pzQuit;
}

document.addEventListener('keydown', e => {
  if (!L || e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  const go = document.getElementById('go'); if (go && !go.disabled && document.activeElement !== go){ e.preventDefault(); go.click(); }
});
if (hasTTS) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (!L && !G && !Z) home(); }; } catch(e) {}
home();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
